<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dormancy Risk</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Open Sans', Arial, sans-serif; background: #f5f6fa; color: #1a1a2e; font-size: 14px; }
  header { background: linear-gradient(135deg, #23A455 0%, #1d8e49 100%); color: #fff; padding: 0 28px; display: flex; align-items: center; gap: 16px; height: 52px; box-shadow: 0 2px 10px rgba(35,164,85,.3); }
  header h1 { font-size: 1rem; font-weight: 700; flex: 1; }
  .back-btn { background: rgba(255,255,255,.12); color: rgba(255,255,255,.9); border: none; border-radius: 6px; padding: 6px 14px; font-size: .8rem; font-weight: 600; cursor: pointer; text-decoration: none; }
  .back-btn:hover { background: rgba(255,255,255,.22); }
  .container { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  .filters { background: #fff; border-radius: 10px; padding: 16px 20px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 20px; }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-group label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #6b7280; }
  select { padding: 7px 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: .85rem; font-family: inherit; background: #fff; color: #111827; min-width: 140px; }
  .btn-run { padding: 8px 20px; background: #23A455; color: #fff; border: none; border-radius: 6px; font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-run:hover { background: #1d8e49; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 10px; padding: 14px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.07); min-width: 130px; flex: 1; }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: #dc2626; line-height: 1; }
  .stat-value.amber { color: #d97706; }
  .stat-value.green { color: #23A455; }
  .stat-label { font-size: .72rem; color: #6b7280; margin-top: 5px; font-weight: 500; }
  .results { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); overflow: hidden; }
  .results-header { padding: 12px 18px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .results-title { font-size: .85rem; font-weight: 700; color: #374151; }
  .results-count { font-size: .8rem; color: #6b7280; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { background: #f8f9fb; text-align: left; padding: 9px 14px; font-size: .7rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #e8eaed; white-space: nowrap; cursor: pointer; }
  th:hover { background: #f0f8f3; color: #23A455; }
  td { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .72rem; font-weight: 700; }
  .badge-red    { background: #fee2e2; color: #991b1b; }
  .badge-amber  { background: #fef3c7; color: #92400e; }
  .badge-yellow { background: #fefce8; color: #713f12; }
  .loading { text-align: center; padding: 40px; color: #9ca3af; }
  .error { background: #fee2e2; color: #991b1b; padding: 16px; border-radius: 8px; margin: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>Dormancy Risk</h1>
  <a class="back-btn" href="/admin/dashboards">All Dashboards</a>
  <a class="back-btn" href="/">Hub</a>
</header>
<div class="container">
  <div class="filters">
    <div class="filter-group">
      <label>Threshold (Days)</label>
      <select id="threshold">
        <option value="60">60+ days</option>
        <option value="90" selected>90+ days</option>
        <option value="120">120+ days</option>
        <option value="180">180+ days</option>
        <option value="365">365+ days</option>
      </select>
    </div>
    <button class="btn-run" onclick="load()">Run</button>
  </div>
  <div id="loading" class="loading">Loading dormancy data…</div>
  <div id="error" class="error" style="display:none;"></div>
  <div id="content" style="display:none;">
    <div class="stats" id="stats"></div>
    <div class="results">
      <div class="results-header">
        <span class="results-title">Accounts at Risk</span>
        <span class="results-count" id="count-label"></span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th onclick="sortTable(0)">Account</th>
            <th onclick="sortTable(1)">Owner</th>
            <th onclick="sortTable(2)">Region</th>
            <th onclick="sortTable(3)">Platform</th>
            <th onclick="sortTable(4)">Last App Date</th>
            <th onclick="sortTable(5)">Days Since App</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
let _rows = [];
let _sortCol = 5, _sortDir = -1;
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function load() {
  document.getElementById('loading').style.display = '';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  const t = document.getElementById('threshold').value;
  try {
    const r = await fetch(`/api/admin/dashboard/dormancy-risk?threshold=${t}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const d = await r.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
    _rows = d.accounts;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-value">${d.total_at_risk.toLocaleString()}</div><div class="stat-label">Total at Risk (${d.threshold_days}+ days)</div></div>
      <div class="stat"><div class="stat-value amber">${d.over_60_days.toLocaleString()}</div><div class="stat-label">60+ Days</div></div>
      <div class="stat"><div class="stat-value">${d.over_90_days.toLocaleString()}</div><div class="stat-label">90+ Days</div></div>
      <div class="stat"><div class="stat-value">${d.over_180_days.toLocaleString()}</div><div class="stat-label">180+ Days</div></div>`;
    document.getElementById('count-label').textContent = `${d.accounts.length} accounts`;
    renderTable();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
    document.getElementById('error').textContent = 'Error: ' + e.message;
  }
}

function renderTable() {
  const cols = [
    r => r.account_name, r => r.owner, r => r.region, r => r.platform,
    r => r.last_app_date, r => r.days_since_app
  ];
  const sorted = [..._rows].sort((a,b) => {
    const va = cols[_sortCol](a) ?? ''; const vb = cols[_sortCol](b) ?? '';
    return _sortDir * (va < vb ? -1 : va > vb ? 1 : 0);
  });
  document.getElementById('tbody').innerHTML = sorted.map(a => {
    const d = a.days_since_app;
    const cls = d >= 180 ? 'badge-red' : d >= 90 ? 'badge-amber' : 'badge-yellow';
    return `<tr>
      <td><a href="https://microf.activehosted.com/app/accounts/${a.account_id}" target="_blank" style="color:#23A455;text-decoration:none;">${esc(a.account_name)}</a></td>
      <td>${esc(a.owner)}</td>
      <td>${esc(a.region)}</td>
      <td>${esc(a.platform)}</td>
      <td>${esc(a.last_app_date||'—')}</td>
      <td><span class="badge ${cls}">${d}d</span></td>
    </tr>`;
  }).join('');
}
function sortTable(col) {
  if (_sortCol === col) _sortDir *= -1; else { _sortCol = col; _sortDir = -1; }
  renderTable();
}
load();
</script>
</body>
</html>
