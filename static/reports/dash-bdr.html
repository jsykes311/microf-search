<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BDR Performance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Open Sans', Arial, sans-serif; background: #f5f6fa; color: #1a1a2e; font-size: 14px; }
  header { background: linear-gradient(135deg, #23A455 0%, #1d8e49 100%); color: #fff; padding: 0 28px; display: flex; align-items: center; gap: 16px; height: 52px; box-shadow: 0 2px 10px rgba(35,164,85,.3); }
  header h1 { font-size: 1rem; font-weight: 700; flex: 1; }
  .back-btn { background: rgba(255,255,255,.12); color: rgba(255,255,255,.9); border: none; border-radius: 6px; padding: 6px 14px; font-size: .8rem; font-weight: 600; cursor: pointer; text-decoration: none; }
  .back-btn:hover { background: rgba(255,255,255,.22); }
  .container { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  .filters { background: #fff; border-radius: 10px; padding: 16px 20px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 20px; }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-group label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #6b7280; }
  input[type=date] { padding: 7px 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: .85rem; font-family: inherit; background: #fff; color: #111827; }
  .btn-run { padding: 8px 20px; background: #23A455; color: #fff; border: none; border-radius: 6px; font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-run:hover { background: #1d8e49; }
  .results { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); overflow: hidden; margin-bottom: 20px; }
  .results-header { padding: 12px 18px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .results-title { font-size: .85rem; font-weight: 700; color: #374151; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { background: #f8f9fb; text-align: left; padding: 9px 14px; font-size: .7rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #e8eaed; white-space: nowrap; }
  td { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }
  .num { font-weight: 700; color: #23A455; }
  .num-amber { font-weight: 700; color: #d97706; }
  .loading { text-align: center; padding: 40px; color: #9ca3af; }
  .error { background: #fee2e2; color: #991b1b; padding: 16px; border-radius: 8px; margin: 20px 0; }
  .mini-list { font-size: .75rem; color: #374151; }
</style>
</head>
<body>
<header>
  <h1>BDR Performance</h1>
  <a class="back-btn" href="/admin/dashboards">All Dashboards</a>
  <a class="back-btn" href="/">Hub</a>
</header>
<div class="container">
  <div class="filters">
    <div class="filter-group">
      <label>From Date</label>
      <input type="date" id="from-date">
    </div>
    <div class="filter-group">
      <label>To Date</label>
      <input type="date" id="to-date">
    </div>
    <button class="btn-run" onclick="load()">Run</button>
  </div>
  <div id="loading" class="loading">Loading BDR performance data…</div>
  <div id="error" class="error" style="display:none;"></div>
  <div id="content" style="display:none;">
    <div class="results">
      <div class="results-header">
        <span class="results-title">BDR Activations &amp; Pipeline</span>
        <span id="range-label" style="font-size:.78rem;color:#6b7280;"></span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>BDR</th>
            <th>This Month</th>
            <th>This Quarter</th>
            <th>This Year</th>
            <th>Custom Range</th>
            <th>Pipeline</th>
            <th>Waiting Approval</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="results" id="approval-section" style="display:none;">
      <div class="results-header"><span class="results-title">Accounts Waiting BDR Approval</span></div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>BDR</th><th>Account</th><th>Platform</th></tr></thead>
          <tbody id="approval-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Default dates: YTD
const today = new Date();
const jan1 = new Date(today.getFullYear(), 0, 1);
document.getElementById('from-date').value = jan1.toISOString().slice(0,10);
document.getElementById('to-date').value   = today.toISOString().slice(0,10);

async function load() {
  document.getElementById('loading').style.display = '';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error').style.display = 'none';

  const fromDate = document.getElementById('from-date').value;
  const toDate   = document.getElementById('to-date').value;
  try {
    const r = await fetch(`/api/admin/dashboard/bdr-performance?from_date=${fromDate}&to_date=${toDate}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const d = await r.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
    document.getElementById('range-label').textContent = `${d.from_date} → ${d.to_date}`;

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = d.bdr_performance.map(b => `
      <tr>
        <td style="font-weight:600;">${esc(b.bdr)}</td>
        <td class="num">${b.activations_this_month}</td>
        <td class="num">${b.activations_this_quarter}</td>
        <td class="num">${b.activations_this_year}</td>
        <td class="num">${b.activations_custom_range}</td>
        <td class="${b.pipeline_count > 0 ? 'num-amber' : ''}">${b.pipeline_count}</td>
        <td class="${b.waiting_approval > 0 ? 'num-amber' : ''}">${b.waiting_approval}</td>
      </tr>`).join('');

    // Approval queue
    const approvalRows = d.bdr_performance.flatMap(b =>
      (b.pending_statuses||[]).map(a => ({bdr: b.bdr, ...a}))
    );
    if (approvalRows.length > 0) {
      document.getElementById('approval-section').style.display = '';
      document.getElementById('approval-tbody').innerHTML = approvalRows.map(a => `
        <tr>
          <td>${esc(a.bdr)}</td>
          <td><a href="https://microf.activehosted.com/app/accounts/${a.account_id}" target="_blank">${esc(a.account_name||a.account_id)}</a></td>
          <td>${esc(a.platform)}</td>
        </tr>`).join('');
    }
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
    document.getElementById('error').textContent = 'Error: ' + e.message;
  }
}
load();
</script>
</body>
</html>
