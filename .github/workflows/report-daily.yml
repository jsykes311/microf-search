name: Daily Activations Report

on:
  workflow_dispatch:

jobs:
  send-activations:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger activations report
        run: |
          curl -f --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            "https://microf-search.onrender.com/api/send-report/activations"
